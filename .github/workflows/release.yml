name: Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          # The GitHub Actions run number is monotonically increasing across
          # every workflow run in this repo, so each published release gets
          # a strictly larger build number than the last.
          NEXT_PUBLIC_BUILD_NUMBER: ${{ github.run_number }}
          NEXT_PUBLIC_RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: cejm-tutoring-build-${{ github.run_number }}
          path: .next
          retention-days: 30

      # Deployment is intentionally left to the hosting provider you choose.
      # Whatever host you deploy to, keep passing the same two env vars at
      # build time so the footer's build number stays accurate:
      #
      #   NEXT_PUBLIC_BUILD_NUMBER: ${{ github.run_number }}
      #   NEXT_PUBLIC_RELEASE_TAG: ${{ github.event.release.tag_name }}
      #
      # Example (Vercel CLI, given VERCEL_TOKEN/VERCEL_ORG_ID/VERCEL_PROJECT_ID secrets):
      #
      # - name: Deploy to Vercel
      #   run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
